DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Patient form</title> 
</head> 
<body>
    <h1>PATIENT  FORM</h1>
  <form action="" method="post" name="registration"> 
      <p>
          Full Name:
          <input type="text"name="Full Name"max length="26"/>
      </p>
      <p>
            Date of Birth:
            <input type="date"name="dob"
      </p>
      <p>
        Gender:
        <br/>
        <input type="radio"name="genre"id=""/>Male
        <input type="radio"name="genre"id=""/>Female
    </p> 
      <p>
          ID Number:
          <input type="text"name="ID number"max length="26"/>
      </p>
      <p>
          Patient Id:
          <input type="text"name="Patient ID"max length="26"/>
      </p>
      <p>
        Phone Number:
        <input type="phone number"name="phone number"maxlength="10"/>
        </p>
        <p>
        Health Status:
        <br/>
        <input type="radio"name="genre"id=""/>Healthy
        <input type="radio"name="genre"id=""/>Sick
    </p> 
      <p>
          Email:
          <input type="text"name="email"max length="26"/>
      </p>
      <p>
        Marital Status:
        <br/>
        <input type="radio"name="genre"id=""/>Single
        <input type="radio"name="genre"id=""/>Married  
    </p>
    <p>
          Next of Kin:
          <input type="text"name="Next of Kin"max length="26"/>
      </p>
      <p>
          Weight:
          <input type="text"name="Weight"max length="26"/>
      </p>
            <p>
            <input type="checkbox"name="term">
            I agree with the Terms and Conditions
            <br><br>
            </p>
            <input type="Submit"name="Register">
            <input type="reset"name="Cancel">
  </form> 
</body> 
</html>
